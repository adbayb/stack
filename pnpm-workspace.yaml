packages:
    - "stack"
    - "stack/create"
saveExact: true
verifyDepsBeforeRun: "warn"
update:
    githubActions: true
minimumReleaseAgeExclude:
    - "@adbayb/*"
    - "quickbundle"
    - "termost"
    - "@types/node@24.19.2"
    - "@pnpm/exe.android-arm64@12.18.0"
    - "@pnpm/exe.android-x64@12.18.0"
    - "@pnpm/exe.darwin-arm64@12.18.0"
    - "@pnpm/exe.darwin-x64@12.18.0"
    - "@pnpm/exe.freebsd-x64@12.18.0"
    - "@pnpm/exe.linux-arm64-musl@12.18.0"
    - "@pnpm/exe.linux-arm64@12.18.0"
    - "@pnpm/exe.linux-ppc64@12.18.0"
    - "@pnpm/exe.linux-riscv64@12.18.0"
    - "@pnpm/exe.linux-s390x@12.18.0"
    - "@pnpm/exe.linux-x64-musl@12.18.0"
    - "@pnpm/exe.linux-x64@12.18.0"
    - "@pnpm/exe.win32-arm64@12.18.0"
    - "@pnpm/exe.win32-x64@12.18.0"
    - pnpm@12.18.0
publicHoistPattern:
    - "*changesets*"
    - "*commitlint*"
    - "*oxfmt*"
    - "*oxlint*"
    - "*turbo*"
    - "*typescript*"
    - "*types*"
skills:
    dirs:
        - .agents/skills
