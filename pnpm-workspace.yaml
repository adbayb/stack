packages:
    - "stack"
    - "stack/create"
saveExact: true
verifyDepsBeforeRun: "warn"
update:
    githubActions: true
minimumReleaseAgeExclude:
    - "@adbayb/*"
    - "quickbundle"
    - "termost"
    - "@types/node@24.19.2"
publicHoistPattern:
    - "*changesets*"
    - "*commitlint*"
    - "*oxfmt*"
    - "*oxlint*"
    - "*turbo*"
    - "*typescript*"
    - "*types*"
