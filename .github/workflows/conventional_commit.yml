name: Conventional commit

on:
    pull_request:
        types: [opened, edited]

jobs:
    main:
        timeout-minutes: 5
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      build
                      chore
                      ci
                      docs
                      feat
                      fix
                      perf
                      refactor
                      revert
                      style
                      test
                  requireScope: false
                  subjectPattern: ^(?![A-Z]).+$
                  subjectPatternError: The subject must start with a lowercase character
